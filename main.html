<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMTEM+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&display=swap" rel="stylesheet">
  
  <style>
    /* ===================================================
       1. สไตล์พื้นฐานและการจัดระยะ (Global Styles)
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Bai Jamjuree', sans-serif;
    }
    body {
      color: #333;
      background-color: #fffdf8;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* ===================================================
       2. ส่วนหัวของเว็บ (Header / Navbar)
       =================================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid #8a4b0f;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #8a4b0f;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 17px;
    }
    .menu-toggle-btn {
      background: none;
      border: 1px solid #8a4b0f;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
      color: #8a4b0f;
    }

    /* ===================================================
       3. เมนูหมวดหมู่สินค้าและปุ่มจัดการ
       =================================================== */
    #categoryMenu {
      display: none;
      border-bottom: 1px solid #8a4b0f;
      background-color: #fffdf8;
    }
    #categoryMenu.active {
      display: block;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid #f0e6d6;
      text-decoration: none;
      color: #555;
      cursor: pointer;
      font-size: 15px;
    }
    .menu-item:hover {
      background-color: #fff5c8;
      color: #8a4b0f;
    }
    .menu-item.highlight-btn {
      font-weight: 600;
      color: #8a4b0f;
      background-color: #fef7e0;
    }

    /* ช่องค้นหาสินค้า (แสดงเมื่อกดเมนูค้นหา) */
    .search-box-container {
      display: none;
      padding: 12px 10px;
      background: #fdf5e6;
      border-bottom: 1px solid #8a4b0f;
      gap: 8px;
    }
    .search-box-container.active {
      display: flex;
    }
    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #8a4b0f;
      border-radius: 4px;
      font-size: 14px;
      background: #fff;
    }
    .search-clear-btn {
      padding: 6px 12px;
      border: 1px solid #8a4b0f;
      background: #fff;
      color: #8a4b0f;
      border-radius: 4px;
      cursor: pointer;
    }

    /* ===================================================
       4. ชื่อหน้าและแถบกรองสินค้า (Filter Bar)
       =================================================== */
    .page-title {
      color: #8a4b0f;
      font-size: 24px;
      margin: 20px 0 15px;
    }
    .filters-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .filter-item select {
      padding: 6px 12px;
      border: 1px solid #8a4b0f;
      border-radius: 4px;
      background: #fffdf8;
      font-family: inherit;
    }

    /* ===================================================
       5. รายการสินค้า (Product Grid)
       =================================================== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }
    .product-card {
      text-align: center;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: translateY(-4px);
    }
    .product-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #fff5c8;
    }
    .product-name {
      font-size: 15px;
      color: #555;
      margin-top: 10px;
      font-weight: 500;
    }
    .product-price {
      font-size: 16px;
      font-weight: bold;
      color: #8a4b0f;
      margin-top: 4px;
    }
    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 0;
      color: #888;
      font-size: 16px;
    }

    /* ===================================================
       6. หน้าต่างป็อปอัปสำหรับเพิ่มสินค้า (Modal Form)
       =================================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: #fffdf8;
      border: 2px solid #8a4b0f;
      border-radius: 8px;
      max-width: 450px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-header h2 {
      font-size: 20px;
      color: #8a4b0f;
    }
    .modal-close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 5px;
      color: #555;
    }
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #8a4b0f;
      outline: none;
    }
    .checkbox-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 5px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background-color: #8a4b0f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background-color: #6d3a0a;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ส่วนหัว (Header) -->
    <header>
      <div class="logo">🌸TERMTEM+</div>
      <div class="header-right">
        <span>👤 ล็อกอิน/สมัครสมาชิก</span>
        <span>🛒 0</span>
        <button class="menu-toggle-btn" onclick="toggleMenu()">☰ เมนู</button>
      </div>
    </header>

    <!-- รายการหมวดหมู่สินค้า -->
    <nav id="categoryMenu">
      
      <!-- 1. เมนูเปิด-ปิดกล่องค้นหา -->
      <div class="menu-item highlight-btn" onclick="toggleSearchBox()">
        <span>ค้นหาสินค้า</span> <span>🔍</span>
      </div>

      <!-- 2. เมนูปุ่มเปิดฟอร์มเพิ่มสินค้าใหม่ -->
      <div class="menu-item highlight-btn" onclick="openAddModal()">
        <span>เพิ่มสินค้าใหม่</span> <span>➕</span>
      </div>
    </nav>

    <!-- ช่องค้นหาสินค้า (Search Bar) -->
    <div id="searchBoxContainer" class="search-box-container">
      <input type="text" id="searchInput" class="search-input" placeholder="พิมพ์ชื่อดอกไม้ที่ต้องการค้นหา..." oninput="applyFilters()">
      <button class="search-clear-btn" onclick="clearSearch()">ล้างการค้นหา</button>
    </div>

    <!-- หัวข้อและตัวกรอง -->
    <h1 class="page-title">ช่อดอกไม้</h1>
    <div class="filters-bar">
      <!-- ตัวกรองราคา -->
      <div class="filter-item">
        <label for="priceFilter">ราคา:</label>
        <select id="priceFilter" onchange="applyFilters()">
          <option value="all">ทั้งหมด</option>
          <option value="under1500">ต่ำกว่า 1,500</option>
          <option value="1500-2500">1,500 - 2,500</option>
          <option value="above2500">มากกว่า 2,500</option>
        </select>
      </div>

      <!-- ตัวจัดเรียงลำดับ -->
      <div class="filter-item">
        <label for="sortFilter">จัดเรียง:</label>
        <select id="sortFilter" onchange="applyFilters()">
          <option value="popular">ยอดนิยม</option>
          <option value="price-asc">ราคา: ต่ำไปสูง</option>
          <option value="price-desc">ราคา: สูงไปต่ำ</option>
        </select>
      </div>

      <!-- ตัวกรองโอกาส -->
      <div class="filter-item">
        <label for="occasionFilter">โอกาส:</label>
        <select id="occasionFilter" onchange="applyFilters()">
          <option value="all">ทั้งหมด</option>
          <option value="birthday">วันเกิด</option>
          <option value="graduation">รับปริญญา</option>
          <option value="congrats">แสดงความยินดี</option>
        </select>
      </div>
    </div>

    <!-- ตารางแสดงสินค้า -->
    <main class="product-grid" id="productGrid"></main>
  </div>

  <!-- ป็อปอัปแบบฟอร์มเพิ่มสินค้าใหม่ (Modal) -->
  <div id="addModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>เพิ่มรายการสินค้าใหม่</h2>
        <button class="modal-close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      
      <form id="newProductForm" onsubmit="handleAddNewProduct(event)">
        <div class="form-group">
          <label for="newProdName">ชื่อสินค้า *</label>
          <input type="text" id="newProdName" placeholder="เช่น Daisy Sunshine" required>
        </div>

        <div class="form-group">
          <label for="newProdPrice">ราคา (บาท) *</label>
          <input type="number" id="newProdPrice" min="1" placeholder="เช่น 1800" required>
        </div>

        <div class="form-group">
          <label for="newProdImg">ลิงก์รูปภาพ (URL)</label>
          <input type="url" id="newProdImg" placeholder="https://example.com/image.jpg">
        </div>

        <div class="form-group">
          <label>เหมาะสำหรับโอกาส:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="occasionCheck" value="birthday"> วันเกิด</label>
            <label><input type="checkbox" name="occasionCheck" value="graduation"> รับปริญญา</label>
            <label><input type="checkbox" name="occasionCheck" value="congrats"> แสดงความยินดี</label>
          </div>
        </div>

        <button type="submit" class="btn-submit">+ บันทึกสินค้า</button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. จัดการเมนู และ กล่องค้นหา
    // ==========================================
    function toggleMenu() {
      const menu = document.getElementById('categoryMenu');
      menu.classList.toggle('active');
    }

    function toggleSearchBox() {
      const searchBox = document.getElementById('searchBoxContainer');
      searchBox.classList.toggle('active');
      if (searchBox.classList.contains('active')) {
        document.getElementById('searchInput').focus();
      }
    }

    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      searchInput.value = '';
      applyFilters();
    }

    // ==========================================
    // 2. จัดการ Modal เพิ่มสินค้าใหม่
    // ==========================================
    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('newProductForm').reset();
    }

    // ==========================================
    // 3. ข้อมูลสินค้าตั้งต้น (Array of Products)
    // ==========================================
    const products = [
      {
        id: 1,
        name: "Pastel Dream",
        price: 2590,
        popularity: 95,
        occasions: ["birthday", "congrats"],
        img: "https://i.pinimg.com/736x/7c/51/d9/7c51d99b4fb4463be950c8e7ef576cf1.jpg"
      },
      {
        id: 2,
        name: "Blooming Paradise",
        price: 3800,
        popularity: 88,
        occasions: ["congrats", "graduation"],
        img: "https://i.pinimg.com/736x/61/cd/65/61cd65ba2c05be9de85a3f4ad88a7e42.jpg"
      },
      {
        id: 3,
        name: "Romantic Blossom",
        price: 3160,
        popularity: 92,
        occasions: ["birthday"],
        img: "https://i.pinimg.com/736x/c2/7c/c9/c27cc9f21e3782d2f7c0b8b9220627e2.jpg"
      },
      {
        id: 4,
        name: "Morning Sunshine",
        price: 1290,
        popularity: 75,
        occasions: ["graduation", "congrats"],
        img: "https://i.pinimg.com/736x/56/b8/6f/56b86f967314de094717cce142fabec1.jpg"
      },
      {
        id: 5,
        name: "Autumn Glow",
        price: 1150,
        popularity: 80,
        occasions: ["graduation"],
        img: "https://i.pinimg.com/1200x/be/8b/8e/be8b8e5989b0e16153afe8b4f8449498.jpg"
      },
      {
        id: 6,
        name: "Sweet Lily Charm",
        price: 1420,
        popularity: 85,
        occasions: ["birthday", "congrats"],
        img: "https://i.pinimg.com/1200x/14/cb/8f/14cb8ff8c75c6f0f5836af0d93019622.jpg"
      }
    ];

    // ==========================================
    // 4. เรนเดอร์การ์ดสินค้า
    // ==========================================
    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = '<div class="no-products">ไม่พบสินค้าที่ตรงตามเงื่อนไขหรือคำค้นหา</div>';
        return;
      }

      items.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.img}" alt="${product.name}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=TERMTEM+'">
          <div class="product-name">${product.name}</div>
          <div class="product-price">฿${product.price.toLocaleString()}</div>
        `;
        grid.appendChild(card);
      });
    }

    // ==========================================
    // 5. ค้นหา + กรอง + จัดเรียง
    // ==========================================
    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const priceVal = document.getElementById('priceFilter').value;
      const sortVal = document.getElementById('sortFilter').value;
      const occasionVal = document.getElementById('occasionFilter').value;

      let filtered = products.filter(product => {
        // กรองด้วยคำค้นหา (ชื่อสินค้า)
        const matchSearch = product.name.toLowerCase().includes(searchQuery);

        // กรองด้วยราคา
        let matchPrice = true;
        if (priceVal === 'under1500') {
          matchPrice = product.price < 1500;
        } else if (priceVal === '1500-2500') {
          matchPrice = product.price >= 1500 && product.price <= 2500;
        } else if (priceVal === 'above2500') {
          matchPrice = product.price > 2500;
        }

        // กรองด้วยโอกาส
        let matchOccasion = true;
        if (occasionVal !== 'all') {
          matchOccasion = product.occasions.includes(occasionVal);
        }

        return matchSearch && matchPrice && matchOccasion;
      });

      // จัดเรียง
      if (sortVal === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortVal === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sortVal === 'popular') {
        filtered.sort((a, b) => b.popularity - a.popularity);
      }

      renderProducts(filtered);
    }

    // ==========================================
    // 6. ฟังก์ชันรับข้อมูลและบันทึกสินค้าใหม่
    // ==========================================
    function handleAddNewProduct(event) {
      event.preventDefault(); // ป้องกันการ reload หน้า

      const name = document.getElementById('newProdName').value.trim();
      const price = parseFloat(document.getElementById('newProdPrice').value);
      const imgInput = document.getElementById('newProdImg').value.trim();
      const img = imgInput || 'https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=500'; // รูปสำรองถ้าไม่ได้ระบุ

      // ดึงโอกาสที่เลือกจาก Checkbox
      const checkedBoxes = document.querySelectorAll('input[name="occasionCheck"]:checked');
      const selectedOccasions = Array.from(checkedBoxes).map(cb => cb.value);

      // สร้าง Object สินค้าใหม่
      const newProduct = {
        id: Date.now(),
        name: name,
        price: price,
        popularity: 100, // สินค้ามาใหม่ให้ความนิยมสูงเป็นพิเศษ
        occasions: selectedOccasions.length > 0 ? selectedOccasions : ['birthday', 'congrats', 'graduation'],
        img: img
      };

      // เพิ่มเข้า array หลัก (ใส่ไว้บนสุดด้วย unshift)
      products.unshift(newProduct);

      // ปิด modal และอัปเดตหน้าจอทันที
      closeAddModal();
      applyFilters();
      alert(`เพิ่มสินค้า "${name}" สำเร็จเรียบร้อย!`);
    }

    // เริ่มต้นแสดงผลทันทีเมื่อโหลดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', applyFilters);
  </script>
</body>
</html>
