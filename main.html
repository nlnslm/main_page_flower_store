<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- กำหนดให้แสดงผลพอดีกับหน้าจอทุกขนาด (Responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMTEM+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
  <style>
    /* ===================================================
       1. สไตล์พื้นฐานและการจัดระยะ (Global Styles)
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Bai Jamjuree', sans-serif;
    }
    body {
      color: #333;
      background-color: #fff;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* ===================================================
       2. ส่วนหัวของเว็บ (Header / Navbar)
       =================================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid #f8d7da; /* เส้นขอบล่างสีชมพูอ่อน */
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #8a4b0f; /* สีชมพูหลัก */
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
    }
    /* ปุ่มเปิด-ปิดเมนู (Hamburger) */
    .menu-toggle-btn {
      background: none;
      border: 1px solid #ccc;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* ===================================================
       3. เมนูหมวดหมู่สินค้า (Category Navigation Menu)
       =================================================== */
    #categoryMenu {
      display: none; /* ซ่อนไว้ก่อน จะเปิดเมื่อกดปุ่ม */
      border-bottom: 1px solid #eee;
    }
    #categoryMenu.active {
      display: block; /* แสดงผลเมื่อมีคลาส active */
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid #f5f5f5;
      text-decoration: none;
      color: #555;
    }
    .menu-item:hover {
      background-color: #fff5f8;
      color: #8a4b0f;
    }

    /* ===================================================
       4. ชื่อหน้าและแถบกรองสินค้า (Filter Bar)
       =================================================== */
    .page-title {
      color: #8a4b0f;
      font-size: 24px;
      margin: 20px 0 15px;
    }
    .filters-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .filter-item select {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    /* ===================================================
       5. รายการสินค้า (Product Grid)
       =================================================== */
    .product-grid {
      display: grid;
      /* แสดง 3 คอลัมน์บนจอคอม และจะย่อลงมาอัตโนมัติเมื่อจอแคบลง */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }
    .product-card {
      text-align: center;
    }
    .product-card img {
      width: 100%;
      height: 320px;
      object-fit: cover; /* จัดภาพให้เต็มกรอบโดยไม่เสียสัดส่วน */
      border-radius: 4px;
      background-color: #f9f9f9;
    }
    .product-code {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
    .product-price {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ส่วนหัว (Header) -->
    <header>
      <div class="logo">🌸TERMTEM+</div>
      <div class="header-right">
        <span>👤 ล็อกอิน/สมัครสมาชิก</span>
        <span>🛒 0</span>
        <!-- ปุ่มสลับแสดง/ซ่อนเมนูหมวดหมู่ -->
        <button class="menu-toggle-btn" onclick="toggleMenu()">☰ เมนู</button>
      </div>
    </header>

    <!-- รายการหมวดหมู่สินค้า (เปิด-ปิดได้) -->
    <nav id="categoryMenu">
      <a href="#" class="menu-item"><span>ดอกไม้สด</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>พวงหรีด</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>ดอกไม้ประดิษฐ์</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>กระเช้าของขวัญ</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>ค้นหา</span> <span>🔍</span></a>
    </nav>

    <!-- หัวข้อและตัวกรอง -->
    <h1 class="page-title">ช่อดอกไม้</h1>
    <div class="filters-bar">
      <div class="filter-item">
        <label>ราคา:</label>
        <select>
          <option>ทั้งหมด</option>
          <option>ต่ำกว่า 1,000</option>
          <option>1,000 - 2,500</option>
        </select>
      </div>
      <div class="filter-item">
        <label>จัดเรียง:</label>
        <select>
          <option>ยอดนิยม</option>
          <option>ราคา: ต่ำไปสูง</option>
          <option>ราคา: สูงไปต่ำ</option>
        </select>
      </div>
      <div class="filter-item">
        <label>โอกาส:</label>
        <select>
          <option>ทั้งหมด</option>
          <option>วันเกิด</option>
          <option>รับปริญญา</option>
          <option>แสดงความยินดี</option>
        </select>
      </div>
    </div>

    <!-- ตารางแสดงสินค้า -->
    <main class="product-grid">
      <!-- ชิ้นที่ 1 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?w=500" alt="ช่อดอกไม้ BC-26_01">
        <div class="product-code">BC-26_01</div>
        <div class="product-price">฿ 1,590</div>
      </div>

      <!-- ชิ้นที่ 2 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=500" alt="ช่อดอกไม้ BC-26_02">
        <div class="product-code">BC-26_02</div>
        <div class="product-price">฿1,890</div>
      </div>

      <!-- ชิ้นที่ 3 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=500" alt="ช่อดอกไม้ BL-26_08">
        <div class="product-code">BL-26_08</div>
        <div class="product-price">฿2,200</div>
      </div>
    </main>
  </div>

  <!-- JavaScript สำหรับการทำงานเบื้องต้น -->
  <script>
    // ฟังก์ชันเปิด/ปิดเมนูหมวดหมู่
    function toggleMenu() {
      const menu = document.getElementById('categoryMenu');
      menu.classList.toggle('active');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
