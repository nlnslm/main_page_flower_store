<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- กำหนดให้แสดงผลพอดีกับหน้าจอทุกขนาด (Responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMTEM+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Itim&display=swap" rel="stylesheet">
  
  <style>
    /* ===================================================
       1. สไตล์พื้นฐานและการจัดระยะ (Global Styles)
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Bai Jamjuree', sans-serif;
    }
    body {
      color: #333;
      background-color: #fffdf8; /* สีพื้นหลังอ่อน */
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
    }

    /* ===================================================
       2. ส่วนหัวของเว็บ (Header / Navbar)
       =================================================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid #8a4b0f; /* เส้นขอบล่างสีน้ำตาล */
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #8a4b0f; /* สีน้ำตาลหลัก */
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 17px;
    }
    /* ปุ่มเปิด-ปิดเมนู (Hamburger) */
    .menu-toggle-btn {
      background: none;
      border: 1px solid #8a4b0f;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 16px;
    }

    /* ===================================================
       3. เมนูหมวดหมู่สินค้า (Category Navigation Menu)
       =================================================== */
    #categoryMenu {
      display: none; /* ซ่อนไว้ก่อน จะเปิดเมื่อกดปุ่ม */
      border-bottom: 1px solid #8a4b0f;
    }
    #categoryMenu.active {
      display: block; /* แสดงผลเมื่อมีคลาส active */
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 10px;
      border-bottom: 1px solid #8a4b0f;
      text-decoration: none;
      color: #555;
    }
    .menu-item:hover {
      background-color: #fff5c8;
      color: #8a4b0f;
    }

    /* ===================================================
       4. ชื่อหน้าและแถบกรองสินค้า (Filter Bar)
       =================================================== */
    .page-title {
      color: #8a4b0f;
      font-size: 24px;
      margin: 20px 0 15px;
    }
    .filters-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .filter-item select {
      padding: 6px 12px;
      border: 1px solid #8a4b0f;
      border-radius: 4px;
      background: #fffdf8;
    }

    /* ===================================================
       5. รายการสินค้า (Product Grid)
       =================================================== */
    .product-grid {
      display: grid;
      /* แสดง 3 คอลัมน์บนจอคอม และจะย่อลงมาอัตโนมัติเมื่อจอแคบลง */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 50px;
    }
    .product-card {
      text-align: center;
    }
    .product-card img {
      width: 100%;
      height: 320px;
      object-fit: cover; /* จัดภาพให้เต็มกรอบโดยไม่เสียสัดส่วน */
      border-radius: 4px;
      background-color: #fff5c8;
    }
    .product-code {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
    .product-price {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ส่วนหัว (Header) -->
    <header>
      <div class="logo">🌸TERMTEM+</div>
      <div class="header-right">
        <span>👤 ล็อกอิน/สมัครสมาชิก</span>
        <span>🛒 0</span>
        <!-- ปุ่มสลับแสดง/ซ่อนเมนูหมวดหมู่ -->
        <button class="menu-toggle-btn" onclick="toggleMenu()">☰ เมนู</button>
      </div>
    </header>

    <!-- รายการหมวดหมู่สินค้า (เปิด-ปิดได้) -->
    <nav id="categoryMenu">
      <a href="#" class="menu-item"><span>ดอกไม้สด</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>พวงหรีด</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>ดอกไม้ประดิษฐ์</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>กระเช้าของขวัญ</span> <span>+</span></a>
      <a href="#" class="menu-item"><span>ค้นหา</span> <span>🔍</span></a>
    </nav>

    <!-- หัวข้อและตัวกรอง -->
    <h1 class="page-title">ช่อดอกไม้</h1>
    <div class="filters-bar">
      <div class="filter-item">
        <label>ราคา:</label>
        <select>
          <option>ทั้งหมด</option>
          <option>ต่ำกว่า 1,000</option>
          <option>1,000 - 2,500</option>
        </select>
      </div>
      <div class="filter-item">
        <label>จัดเรียง:</label>
        <select>
          <option>ยอดนิยม</option>
          <option>ราคา: ต่ำไปสูง</option>
          <option>ราคา: สูงไปต่ำ</option>
        </select>
      </div>
      <div class="filter-item">
        <label>โอกาส:</label>
        <select>
          <option>ทั้งหมด</option>
          <option>วันเกิด</option>
          <option>รับปริญญา</option>
          <option>แสดงความยินดี</option>
        </select>
      </div>
    </div>

    <!-- ตารางแสดงสินค้า -->
    <main class="product-grid">
        <!-- ชิ้นที่ 1 -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/7c/51/d9/7c51d99b4fb4463be950c8e7ef576cf1.jpg" alt="ช่อดอกไม้ BC-26_01">
            <div class="product-name">Pastel Dream</div>
            <div class="product-price">฿2,590</div>
        </div>

      <!-- ชิ้นที่ 2 -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/61/cd/65/61cd65ba2c05be9de85a3f4ad88a7e42.jpg" alt="ช่อดอกไม้ BC-26_02">
            <div class="product-name">Blooming Paradise</div>
            <div class="product-price">฿3,800</div>
        </div>

        <!-- ชิ้นที่ 3 -->
        <div class="product-card">
            <img src="https://i.pinimg.com/736x/c2/7c/c9/c27cc9f21e3782d2f7c0b8b9220627e2.jpg" alt="ช่อดอกไม้ BL-26_08">
            <div class="product-name">Romantic Blossom</div>
            <div class="product-price">฿3,160</div>
        </div>

        <!-- ชิ้นที่ 4 -->
        <div class="product-card">
          <img src="https://i.pinimg.com/736x/56/b8/6f/56b86f967314de094717cce142fabec1.jpg" alt="ช่อดอกไม้ BC-26_04">
          <div class="product-name">Morning Sunshine</div>
          <div class="product-price">฿1,290</div>
        </div>

        <!-- ชิ้นที่ 5 -->
        <div class="product-card">
          <img src="https://i.pinimg.com/1200x/be/8b/8e/be8b8e5989b0e16153afe8b4f8449498.jpg" alt="ช่อดอกไม้ BC-26_04">
          <div class="product-name">Autumn Glow</div>
          <div class="product-price">฿1,150</div>
        </div>

        <!-- ชิ้นที่ 6 -->
        <div class="product-card">
          <img src="https://i.pinimg.com/1200x/14/cb/8f/14cb8ff8c75c6f0f5836af0d93019622.jpg" alt="ช่อดอกไม้ BC-26_04">
          <div class="product-name">Sweet Lily Charm</div>
          <div class="product-price">฿1,420</div>
        </div>

      </div>
    </main>
  </div>

  <!-- JavaScript สำหรับการทำงานเบื้องต้น -->
  <script>
    // ฟังก์ชันเปิด/ปิดเมนูหมวดหมู่
    function toggleMenu() {
      const menu = document.getElementById('categoryMenu');
      menu.classList.toggle('active');
    }
  </script>

</body>
</html>
